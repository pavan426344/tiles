version: '3.8'

services:
  backend:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    depends_on:
      - db

  db:
    image: mysql:5.7
    restart: always
    ports:
      - '3306:3306'
    env_file:
      - ./backend/.env
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
